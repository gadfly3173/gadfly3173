name: 提醒动画更新

on:
  workflow_dispatch:
  schedule:
    - cron: "0/30 0-16 * * *"

permissions:
  contents: write

# Both scheduled jobs write to the default branch, so let one finish its commit before another starts.
concurrency:
  group: automated-master-updates
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  notify-anime-update:
    name: 提醒动画更新
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Execute script with retries
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          for attempt in 1 2 3; do
            echo "Running anime notification attempt ${attempt}/3"
            if yarn notify-anime \
              "-mailUser=${MAIL_USER}" \
              "-mailPass=${MAIL_PASS}" \
              "-mailFrom=${MAIL_FROM}" \
              "-mailTo=${MAIL_TO}"; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Notification failed; retrying in ${delay} seconds"
              sleep "${delay}"
            fi
          done

          exit 1

      - name: Check if there are any changes
        id: verify_diff
        run: |
          git diff --quiet -- src/notify-anime/last-notified.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Submit updated files
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git add src/notify-anime/last-notified.json
          git commit -m "update anime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
